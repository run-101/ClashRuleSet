services:
  subconverter-extended:
    image: aethersailor/subconverter-extended:latest
    container_name: subconverter-extended
    restart: unless-stopped
    ports:
      - "25500:25500"
    volumes:
      - /Volumes/UrineBag/Docker/subconverter-extended/base:/base

  sub-store:
    image: xream/sub-store:latest
    container_name: sub-store
    restart: unless-stopped
    environment:
      SUB_STORE_FRONTEND_BACKEND_PATH: /sub-store
    ports:
      - "25600:3001"
    volumes:
      - /Volumes/UrineBag/Docker/sub-store:/opt/app/data